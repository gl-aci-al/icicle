<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Contact | Icicle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Stack+Sans+Text:wght@400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../script.js" defer></script>
</head>

<body>
  <video class="background-video" autoplay muted loop playsinline aria-hidden="true"></video>
  <a class="page-home" href="../">Home</a>
  <main class="content-main">
    <article class="content-page">
      <h1 class="content-title">Contact</h1>
      <ul class="contact-list">
        <li class="contact-item">
          <svg class="contact-icon contact-icon--email" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="5.5" width="17" height="13" rx="1.5"></rect>
            <path d="m4.5 7 7.5 6 7.5-6"></path>
          </svg>
          <div class="contact-item-copy">
            <h2>Email</h2>
            <a href="mailto:contact@gl.aci.al">contact@gl.aci.al</a>
            <p class="contact-response">Response time: around 3 days</p>
          </div>
        </li>
        <li class="contact-item">
          <img class="contact-discord" src="../assets/discord.svg" alt="" width="36" height="36">
          <div class="contact-item-copy">
            <h2>Discord</h2>
            <p>Coming soon</p>
          </div>
        </li>
        <li class="contact-item">
          <svg class="contact-icon contact-icon--x" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor"
              d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.6 22H2.4l7.3-8.4L1.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20Z">
            </path>
          </svg>
          <div class="contact-item-copy">
            <h2>X</h2>
            <a href="https://x.com/cozzwave">@cozzwave</a>
          </div>
        </li>
      </ul>
    </article>
  </main>
  <footer class="site-note">Not affiliated with X Corp.</footer>
</body>

</html>
